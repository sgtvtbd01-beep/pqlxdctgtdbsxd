<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Phòng Xây dựng Đường bộ - Sở Xây dựng TP.HCM</title>

  <!-- Chống lưu bộ nhớ đệm cũ trên điện thoại (Bắt buộc cập nhật mới) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA & Apple iOS Standalone Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Xây dựng Đường bộ" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="icon" type="image/png" href="logo_sxd_official.png" />
  <link rel="apple-touch-icon" href="logo_sxd_official.png" />
  <link rel="manifest" href="manifest.json" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: pan-x pan-y;
    }

    /* Khung chứa iframe toàn màn hình */
    #app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 1;
      background: #ffffff;
    }

    iframe#app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      flex: 1;
      background-color: #ffffff;
    }

    /* Màn hình Splash TƯƠI SÁNG 100% (Nền trắng tinh tế, không còn màu tím than) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #0f172a;
      padding: 24px;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Logo tròn nguyên bản, tuyệt đối không có viền vuông bo góc */
    .splash-logo {
      width: 110px;
      height: 110px;
      border-radius: 50% !important;
      object-fit: contain;
      margin-bottom: 20px;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background: transparent !important;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
      animation: pulseLogo 2s infinite ease-in-out;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .splash-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 6px;
      text-transform: uppercase;
      color: #1e3a8a !important; /* Xanh lam tươi sáng, sang trọng */
    }
    .splash-subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: #475569 !important;
      text-align: center;
      margin-bottom: 28px;
    }

    .splash-loader {
      width: 40px;
      height: 40px;
      border: 3.5px solid #f1f5f9;
      border-radius: 50%;
      border-top-color: #2563eb; /* Xanh dương tươi */
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .splash-tip {
      position: absolute;
      bottom: 24px;
      font-size: 11.5px;
      font-weight: 500;
      color: #94a3b8;
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
    }

    /* Modal cấu hình đường dẫn nếu chưa cài đặt */
    #setup-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 26, 48, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
    }
    #setup-modal.active {
      display: flex;
    }
    .setup-card {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      color: #1e293b;
    }
    .setup-card h2 {
      font-size: 17px;
      font-weight: 700;
      color: #0f2b5b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .setup-card p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .setup-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .setup-input:focus {
      border-color: #2563eb;
    }
    .setup-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn-save {
      background: #0f2b5b;
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-save:hover {
      background: #1b4b9a;
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHỜ (SPLASH LOADING) -->
  <div id="splash-screen">
    <img src="logo_sxd_official.png" alt="Sở Xây dựng" class="splash-logo" onerror="this.style.display='none'" />
    <div class="splash-title">PHÒNG XÂY DỰNG ĐƯỜNG BỘ</div>
    <div class="splash-subtitle">Sở Xây dựng Thành phố Hồ Chí Minh</div>
    <div class="splash-loader"></div>
    <div class="splash-tip">Hệ thống Điều hành & Quản lý Dự án Giao thông Trọng điểm</div>
  </div>

  <!-- CONTAINER CHỨA IFRAME KHÔNG BANNER -->
  <div id="app-container">
    <iframe id="app-frame" allow="fullscreen; geolocation; camera; clipboard-read; clipboard-write"></iframe>
  </div>

  <!-- MODAL CẤU HÌNH LIÊN KẾT GOOGLE APPS SCRIPT (NẾU CẦN ĐỔI) -->
  <div id="setup-modal">
    <div class="setup-card">
      <h2>⚙️ Cấu hình Đường dẫn Phần mềm</h2>
      <p>Nhập hoặc dán đường dẫn Web App Google Apps Script của bạn (dạng <code>https://script.google.com/macros/s/.../exec</code>):</p>
      <input type="url" id="webapp-url-input" class="setup-input" placeholder="https://script.google.com/macros/s/.../exec" />
      <div class="setup-btns">
        <button type="button" class="btn-save" onclick="luuDuongDan()">Lưu & Truy cập</button>
      </div>
    </div>
  </div>

  <script>
    /* ══════════════════════════════════════════════════════════
       CẤU HÌNH ĐƯỜNG DẪN WEB APP APPS SCRIPT MẶC ĐỊNH
       (Bạn có thể dán trực tiếp link exec của bạn vào biến dưới đây)
       ══════════════════════════════════════════════════════════ */
    const DEFAULT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwoEGKJLwLRG_qYXJLUuIOsKE3DoPi37Pvt5GANJTf-m0ryVbqNcaWxbfX-3-prPlw-/exec"; 

    const STORAGE_KEY = "QLXD_SXD_WEBAPP_URL";
    const iframe = document.getElementById("app-frame");
    const splash = document.getElementById("splash-screen");
    const setupModal = document.getElementById("setup-modal");
    const urlInput = document.getElementById("webapp-url-input");

    function khoiDong() {
      // 1. Kiểm tra tham số URL nếu người dùng muốn mở cài đặt lại (?caidat=1)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("caidat") === "1" || urlParams.get("setup") === "1") {
        moCaiDat();
        return;
      }

      // 2. Lấy link cố định hoặc link đã lưu
      let webAppUrl = DEFAULT_WEBAPP_URL || localStorage.getItem(STORAGE_KEY);
      if (DEFAULT_WEBAPP_URL) {
        try { localStorage.setItem(STORAGE_KEY, DEFAULT_WEBAPP_URL); } catch(_) {}
      }

      if (!webAppUrl || webAppUrl.trim() === "") {
        // Chưa có link -> Hiện màn hình nhập link
        moCaiDat();
      } else {
        // Có link -> Gán vào iframe và chạy ngay
        taiPhanMem(webAppUrl.trim());
      }
    }

    function moCaiDat() {
      splash.classList.add("hidden");
      setupModal.classList.add("active");
      urlInput.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_WEBAPP_URL;
      urlInput.focus();
    }

    function luuDuongDan() {
      const val = urlInput.value.trim();
      if (!val || !val.startsWith("http")) {
        alert("Vui lòng dán đúng đường dẫn bắt đầu bằng https://script.google.com/...");
        return;
      }
      localStorage.setItem(STORAGE_KEY, val);
      setupModal.classList.remove("active");
      splash.classList.remove("hidden");
      taiPhanMem(val);
    }

    function taiPhanMem(url) {
      // Bổ sung các tham số truy vấn từ trang ngoài vào iframe nếu có (ví dụ: ?page=duan)
      let finalUrl = url;
      const curSearch = window.location.search;
      if (curSearch && !curSearch.includes("caidat") && !curSearch.includes("setup")) {
        finalUrl += (url.includes("?") ? "&" : "?") + curSearch.substring(1);
      }
      finalUrl += (finalUrl.includes("?") ? "&" : "?") + "_cb=" + Date.now();

      iframe.src = finalUrl;

      // Khi iframe tải xong thì ẩn màn hình Splash
      iframe.onload = function() {
        setTimeout(function() {
          splash.classList.add("hidden");
        }, 350);
      };

      // Dự phòng: Sau 6s tự động ẩn Splash nếu mạng chập chờn
      setTimeout(function() {
        splash.classList.add("hidden");
      }, 6000);
    }

    // Lắng nghe phím tắt / sự kiện khẩn cấp để mở lại trang cấu hình URL:
    // Nhấp 4 lần liên tiếp vào logo splash hoặc mép trên cùng của màn hình
    let clickCount = 0;
    let clickTimer = null;
    window.addEventListener("click", function(e) {
      if (e.clientY < 50) {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(function() { clickCount = 0; }, 1200);
        if (clickCount >= 4) {
          moCaiDat();
          clickCount = 0;
        }
      }
    });

    // Bắt đầu chạy
    window.addEventListener("DOMContentLoaded", khoiDong);
  </script>
</body>
</html>
